spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: category-service
              uri: lb://category-service
              predicates:
                - Path=/api/categories/**
              filters:
                - StripPrefix=0

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**
              filters:
                - StripPrefix=0

server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      default-zone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
